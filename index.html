<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header id="toolbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">SoundOS</span>
    <span class="brand-sub">modular synth builder</span>
  </div>
  <div class="toolbar-actions">
    <button id="btn-add-node" class="btn btn-primary">+ Node</button>
    <button id="btn-generate" class="btn btn-accent">Generate</button>
    <button id="btn-stop" class="btn" disabled>Stop</button>
    <span class="sep"></span>
    <button id="btn-zoom-out" class="btn" title="Отдалить сетку">−</button>
    <button id="zoom-readout" class="btn" title="Сбросить масштаб до 100%">100%</button>
    <button id="btn-zoom-in" class="btn" title="Приблизить сетку">+</button>
    <span class="sep"></span>
    <button id="btn-kill" class="btn btn-danger" title="Зажать — мгновенно заглушить всё, отпустить — вернуть звук">⛔ Kill</button>
    <button id="btn-random" class="btn" title="Перемешать все ручки на холсте">⚄ Chance</button>
    <select id="preset-select" class="btn" title="Пресеты настройки из Pulse Train — Stage II">
      <option value="">Presets…</option>
    </select>
    <button id="btn-scope-mode" class="btn">Scopes: Wave</button>
    <button id="btn-compact" class="btn" title="Компактный вид: убрать осциллографы и сжать все ноды до минимального размера">Compact: Off</button>
    <button id="btn-stage" class="btn" title="Полноэкранный режим для перформанса">⛶ Stage</button>
    <span class="sep"></span>
    <button id="btn-export" class="btn">Export</button>
    <button id="btn-import" class="btn">Import</button>
    <input id="file-import" type="file" accept="application/json" hidden />
    <button id="btn-clear" class="btn btn-danger">Clear</button>
  </div>
</header>

<main id="workspace">
  <div id="canvas-viewport">
    <div id="canvas-inner">
      <svg id="wires-svg"></svg>
      <div id="nodes-layer"></div>
    </div>
    <div id="grid-overlay" hidden></div>
  </div>

  <aside id="node-menu" hidden>
    <div class="menu-head">
      <input id="menu-search" type="text" placeholder="Найти ноду..." />
      <button id="menu-close" class="btn-icon">×</button>
    </div>
    <div id="menu-list" class="menu-list"></div>
  </aside>
</main>

<div id="toast-stack"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
