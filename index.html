<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "bba4e16a7d9b4d9985eda0cda2624e60"}'></script>
</head>
<body>
<header id="toolbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">SoundOS</span>
    <span class="brand-sub">modular synth builder</span>
  </div>
  <div class="toolbar-actions">
    <button id="btn-add-node" class="btn btn-primary">+ Node</button>
    <button id="btn-generate" class="btn btn-accent">Generate</button>
    <button id="btn-stop" class="btn" disabled>Stop</button>
    <span class="sep"></span>
    <button id="btn-zoom-out" class="btn" title="Zoom out">−</button>
    <button id="zoom-readout" class="btn" title="Reset zoom to 100%">100%</button>
    <button id="btn-zoom-in" class="btn" title="Zoom in">+</button>
    <span class="sep"></span>
    <label class="mini-label" title="Global playback speed for the whole network: pitches/rate params scale up, durations (delay/envelope/reverb) scale down — like varispeed on tape">Speed
      <input id="speed-slider" type="range" min="-2" max="2" step="0.01" value="0" />
    </label>
    <button id="speed-readout" class="btn" title="Reset speed to 100%">100%</button>
    <span class="sep"></span>
    <button id="btn-random" class="btn" title="Randomize every knob on the board">⚄ Chance</button>
    <select id="preset-select" class="btn" title="Tuning presets from Pulse Train — Stage II">
      <option value="">Presets…</option>
    </select>
    <button id="btn-scope-mode" class="btn">Scopes: Wave</button>
    <button id="btn-compact" class="btn" title="Compact view: hide oscilloscopes and shrink every node to its tightest layout">Compact: Off</button>
    <button id="btn-stage" class="btn" title="Fullscreen mode for performance">⛶ Stage</button>
    <span class="sep"></span>
    <button id="btn-clear-takes" class="btn" title="Erase every recorded take (loop) in every node — knob positions stay as they are">Clear takes</button>
    <button id="btn-export" class="btn">Export</button>
    <button id="btn-import" class="btn">Import</button>
    <input id="file-import" type="file" accept="application/json" hidden />
    <button id="btn-clear" class="btn btn-danger">Clear</button>
  </div>
</header>

<main id="workspace">
  <div id="canvas-viewport">
    <div id="canvas-inner">
      <svg id="wires-svg"></svg>
      <div id="nodes-layer"></div>
    </div>
    <div id="grid-overlay" hidden></div>
  </div>

  <aside id="node-menu" hidden>
    <div class="menu-head">
      <input id="menu-search" type="text" placeholder="Find a node..." />
      <button id="menu-close" class="btn-icon">×</button>
    </div>
    <div id="menu-list" class="menu-list"></div>
  </aside>
</main>

<div id="toast-stack"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
